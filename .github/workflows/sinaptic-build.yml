# Compilación de Sinaptic Remoto (fork de RustDesk 1.5.0, AGPL-3.0).
# Solo Windows x64 (.exe autoinstalable e instalador .msi) y Android arm64 (.apk firmado con
# la llave propia «sinaptic-remoto», secretos ANDROID_*; sin ellos el workflow falla, no cae a
# la de depuración).
# Android sale en dos variantes de Gradle: «completo» (co.sinaptic.remoto) y «cliente»
# (co.sinaptic.remoto.cliente, solo controla; sin accesibilidad ni captura de pantalla).
# El MSI sale del proyecto WiX de res/msi como en el workflow oficial (ver res/msi/README.md).
# Derivado de flutter-build.yml / bridge.yml, sin pasos que piden secretos de RustDesk
# (firma de código, subida a sus servidores, plantilla MSI, ventana TopMost). Sin firma de código.
name: Sinaptic Remoto - compilar

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en la Release (pre-release) al terminar"
        type: boolean
        default: false
      etiqueta:
        description: "Etiqueta de la Release"
        type: string
        default: "sinaptic-1.5.0-6"

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  # Versión de Sinaptic Remoto (nombre de archivos); va a la par de flutter/pubspec.yaml
  SINAPTIC_VERSION: "1.5.0-6"
  # UpgradeCode del MSI: FIJO PARA SIEMPRE (generado una vez el 12/10/2026). Con él cada MSI
  # nuevo reemplaza al anterior (MajorUpgrade). No cambiarlo. Ver res/msi/README.md.
  SINAPTIC_MSI_UPGRADE_CODE: "278B8821-BA28-449A-89A9-DAAB79021808"
  NDK_VERSION: "r28c"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows-x64:
    needs: [generate-bridge]
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Controlador de pantalla virtual (mismo paso que el workflow oficial)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Impresora remota (opcional; si falla la descarga se sigue)
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
              Write-Host "Se ignora el error del controlador de impresora."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # El instalador registra el servicio, los accesos directos y el desinstalador con
          # «<APP_NAME>.exe» (APP_NAME = SinapticRemoto, src/common.rs). Flutter produce
          # rustdesk.exe: se renombra antes de empaquetar, como los clientes personalizados
          # oficiales. Sin esto la 1.5.0-3 quedó instalada con rustdesk.exe y un servicio
          # apuntando a SinapticRemoto.exe, que no existía.
          mv ./rustdesk/rustdesk.exe ./rustdesk/SinapticRemoto.exe
          ls -l ./rustdesk
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/SinapticRemoto.exe
          popd
          mkdir -p ./SalidaSinaptic
          mv ./target/release/rustdesk-portable-packer.exe ./SalidaSinaptic/SinapticRemoto-${{ env.SINAPTIC_VERSION }}-x86_64.exe
          sha256sum ./SalidaSinaptic/*.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Construir el instalador MSI
        # Igual que «Build msi» del workflow oficial (proyecto WiX v4 de res/msi + acciones
        # personalizadas en C++), con la marca Sinaptic. preprocess.py toma ./rustdesk, que ya
        # trae SinapticRemoto.exe (renombrado en el paso anterior), y con --app-name lo instala
        # en C:\Program Files\SinapticRemoto con el servicio SinapticRemoto.
        shell: pwsh
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk `
            --app-name SinapticRemoto --display-name "Sinaptic Remoto" -m Sinaptic `
            -v "${{ env.SINAPTIC_VERSION }}" --upgrade-code "${{ env.SINAPTIC_MSI_UPGRADE_CODE }}"
          if ($LASTEXITCODE -ne 0) { throw "preprocess.py falló ($LASTEXITCODE)" }
          Write-Host "== Includes.wxi generado =="
          Get-Content ./Package/Includes.wxi | Write-Host
          nuget restore msi.sln
          if ($LASTEXITCODE -ne 0) { throw "nuget restore falló ($LASTEXITCODE)" }
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          if ($LASTEXITCODE -ne 0) { throw "msbuild falló ($LASTEXITCODE)" }
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw "No salió Package.msi" }
          popd
          Move-Item $msi.FullName "./SalidaSinaptic/SinapticRemoto-${{ env.SINAPTIC_VERSION }}-x86_64.msi"
          Get-FileHash ./SalidaSinaptic/*.msi -Algorithm SHA256 | Format-List | Out-String | Write-Host

      - name: Probar el MSI en el runner (instalar y desinstalar)
        # Va antes de la prueba del .exe: el MSI se niega a instalar encima de una copia
        # autoinstalada, y así la prueba del .exe comprueba de paso que el MSI no dejó restos.
        id: prueba_msi
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $msi = (Get-ChildItem ./SalidaSinaptic/SinapticRemoto-*.msi | Select-Object -First 1).FullName
          $codigoEsperado = '{${{ env.SINAPTIC_MSI_UPGRADE_CODE }}}'
          $versionEsperada = '${{ env.SINAPTIC_VERSION }}'.Replace('-', '.')
          $dir = 'C:\Program Files\SinapticRemoto'
          $exe = "$dir\SinapticRemoto.exe"
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\SinapticRemoto"
          $lnkMenu = "$menu\SinapticRemoto.lnk"
          $lnkDesinstalar = "$menu\Uninstall SinapticRemoto.lnk"
          $lnkEscritorio = "$env:PUBLIC\Desktop\SinapticRemoto.lnk"
          $lnkInicio = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\SinapticRemoto Tray.lnk"
          $registros = (New-Item -ItemType Directory -Force -Path ./RegistrosMsi).FullName
          $fallos = [System.Collections.Generic.List[string]]::new()
          $resumen = [System.Collections.Generic.List[string]]::new()
          function Fallo($t) { Write-Host "::error::$t"; $fallos.Add($t) }
          function Bien($t) { Write-Host "OK  $t"; $resumen.Add("OK: $t") }
          function Com($o, $nombre, $tipo, $a) { $o.GetType().InvokeMember($nombre, $tipo, $null, $o, $a) }
          $wi = New-Object -ComObject WindowsInstaller.Installer
          function PropiedadMsi($prop) {
            $db = Com $wi 'OpenDatabase' 'InvokeMethod' @($msi, 0)
            $vista = Com $db 'OpenView' 'InvokeMethod' @("SELECT Value FROM Property WHERE Property='$prop'")
            Com $vista 'Execute' 'InvokeMethod' $null | Out-Null
            $fila = Com $vista 'Fetch' 'InvokeMethod' $null
            $valor = if ($fila) { Com $fila 'StringData' 'GetProperty' @(1) } else { $null }
            Com $vista 'Close' 'InvokeMethod' $null | Out-Null
            [void][Runtime.InteropServices.Marshal]::ReleaseComObject($vista)
            [void][Runtime.InteropServices.Marshal]::ReleaseComObject($db)
            $valor
          }
          function Relacionados() { @(Com $wi 'RelatedProducts' 'GetProperty' @($codigoEsperado)) }
          function Destino($lnk) {
            $l = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            [pscustomobject]@{ Destino = $l.TargetPath; Argumentos = $l.Arguments; Carpeta = $l.WorkingDirectory }
          }
          function EntradaArp() {
            Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Sinaptic Remoto' }
          }
          function EstadoServicio() { (sc.exe query SinapticRemoto | Out-String) }

          Write-Host "== Propiedades del MSI: $msi =="
          $p = @{}
          foreach ($n in 'ProductName', 'Manufacturer', 'ProductVersion', 'UpgradeCode', 'ProductCode') {
            $p[$n] = PropiedadMsi $n; Write-Host ("{0,-15} {1}" -f $n, $p[$n])
          }
          if ($p.ProductName -ne 'Sinaptic Remoto') { Fallo "ProductName es '$($p.ProductName)'" } else { Bien "ProductName = Sinaptic Remoto" }
          if ($p.Manufacturer -ne 'Sinaptic') { Fallo "Manufacturer es '$($p.Manufacturer)'" } else { Bien "Manufacturer = Sinaptic" }
          if ($p.ProductVersion -ne $versionEsperada) { Fallo "ProductVersion es '$($p.ProductVersion)', se esperaba $versionEsperada" } else { Bien "ProductVersion = $versionEsperada" }
          if ($p.UpgradeCode -ne $codigoEsperado) { Fallo "UpgradeCode es '$($p.UpgradeCode)', se esperaba $codigoEsperado" } else { Bien "UpgradeCode = $codigoEsperado" }

          Write-Host "== Instalar: msiexec /i /qn =="
          $pr = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$registros\instalar.log`"") -Wait -PassThru
          Write-Host "msiexec /i terminó con código $($pr.ExitCode)"
          if ($pr.ExitCode -notin 0, 3010) { Fallo "msiexec /i devolvió $($pr.ExitCode)" } else { Bien "msiexec /i /qn código $($pr.ExitCode)" }
          $q = ''
          for ($i = 0; $i -lt 30; $i++) { $q = EstadoServicio; if ($q -match 'RUNNING') { break }; Start-Sleep -Seconds 2 }
          Write-Host "== Contenido de $dir =="
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $qc = sc.exe qc SinapticRemoto | Out-String
          Write-Host $qc; Write-Host $q
          if (Test-Path $exe) { Bien "existe $exe" } else { Fallo "No quedó $exe" }
          if (Test-Path "$dir\rustdesk.exe") { Fallo "Sobra $dir\rustdesk.exe" }
          if ($q -match 'RUNNING') { Bien "servicio SinapticRemoto RUNNING" } else { Fallo "El servicio SinapticRemoto no está en marcha" }
          if ($qc -match [regex]::Escape("`"$exe`" --service")) { Bien "el servicio ejecuta `"$exe`" --service" } else { Fallo "La ruta del servicio no es `"$exe`" --service" }
          Write-Host "== Accesos directos =="
          foreach ($par in @(
              @($lnkMenu, $exe, ''),
              @($lnkEscritorio, $exe, ''),
              @($lnkInicio, $exe, '--tray'),
              @($lnkDesinstalar, 'msiexec.exe', "/x $($p.ProductCode)"))) {
            $lnk, $dest, $args0 = $par
            if (-not (Test-Path $lnk)) { Fallo "No existe el acceso directo $lnk"; continue }
            $d = Destino $lnk
            Write-Host "$lnk -> $($d.Destino) $($d.Argumentos)"
            $destOk = if ($dest -eq 'msiexec.exe') { $d.Destino -like '*\msiexec.exe' } else { $d.Destino -eq $dest }
            if ($destOk -and $d.Argumentos.Trim() -eq $args0) { Bien "$(Split-Path $lnk -Leaf) -> $($d.Destino) $($d.Argumentos)" } else { Fallo "$lnk apunta a '$($d.Destino) $($d.Argumentos)', se esperaba '$dest $args0'" }
          }
          Write-Host "== Programas y características =="
          $arp = EntradaArp
          $arp | Select-Object PSChildName, DisplayName, DisplayVersion, Publisher, InstallLocation, WindowsInstaller | Format-List | Out-String | Write-Host
          if (@($arp).Count -ne 1) { Fallo "Se esperaba una entrada «Sinaptic Remoto» en Programas, hay $(@($arp).Count)" }
          elseif ($arp.Publisher -ne 'Sinaptic' -or $arp.DisplayVersion -ne $versionEsperada) { Fallo "Entrada de Programas: editor '$($arp.Publisher)', versión '$($arp.DisplayVersion)'" }
          else { Bien "Programas: Sinaptic Remoto $($arp.DisplayVersion), editor Sinaptic" }
          $estado = Get-ItemProperty 'HKLM:\SOFTWARE\SinapticRemoto\InstallState\SinapticRemoto' -ErrorAction SilentlyContinue
          if ($estado.MsiProductCode -eq $p.ProductCode -and $estado.WindowsInstaller -eq 1) { Bien "InstallState de la app con MsiProductCode $($estado.MsiProductCode)" } else { Fallo "InstallState de la app no tiene el ProductCode del MSI" }
          $rel = Relacionados
          Write-Host "Productos con el UpgradeCode: $($rel -join ', ')"
          if ($rel -contains $p.ProductCode) { Bien "Windows Installer encuentra el producto por el UpgradeCode" } else { Fallo "El UpgradeCode no lleva al producto instalado" }

          Write-Host "== Desinstalar: msiexec /x /qn =="
          $pr = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$registros\desinstalar.log`"") -Wait -PassThru
          Write-Host "msiexec /x terminó con código $($pr.ExitCode)"
          if ($pr.ExitCode -notin 0, 3010) { Fallo "msiexec /x devolvió $($pr.ExitCode)" } else { Bien "msiexec /x /qn código $($pr.ExitCode)" }
          for ($i = 0; $i -lt 15; $i++) { $q = EstadoServicio; if ($q -match '1060') { break }; Start-Sleep -Seconds 2 }
          Write-Host $q
          if ($q -match '1060') { Bien "servicio SinapticRemoto eliminado" } else { Fallo "El servicio SinapticRemoto sigue registrado" }
          if (Test-Path $dir) {
            Get-ChildItem $dir -Recurse -Force | Select-Object FullName | Out-String | Write-Host
            Fallo "Quedó la carpeta $dir"
          } else { Bien "carpeta $dir eliminada" }
          foreach ($lnk in $lnkMenu, $lnkDesinstalar, $lnkEscritorio, $lnkInicio) { if (Test-Path $lnk) { Fallo "Quedó el acceso directo $lnk" } }
          if (Test-Path $menu) { Fallo "Quedó la carpeta del menú $menu" }
          if (-not ($fallos | Where-Object { $_ -like 'Quedó*' })) { Bien "accesos directos y carpeta del menú eliminados" }
          if (EntradaArp) { Fallo "Sigue la entrada «Sinaptic Remoto» en Programas" } else { Bien "entrada de Programas eliminada" }
          if (@(Relacionados).Count -gt 0) { Fallo "Windows Installer aún ve productos con el UpgradeCode" }
          $vivos = Get-Process SinapticRemoto -ErrorAction SilentlyContinue
          if ($vivos) { Fallo "Siguen procesos SinapticRemoto.exe: $($vivos.Id -join ', ')" } else { Bien "sin procesos SinapticRemoto.exe" }

          $md = @('### Prueba del MSI (instalar y desinstalar con /qn)', '') + ($resumen | ForEach-Object { "- $_" }) + ($fallos | ForEach-Object { "- FALLO: $_" })
          $md -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($fallos.Count -gt 0) { throw "Prueba del MSI con $($fallos.Count) fallo(s): $($fallos -join ' | ')" }
          Write-Host "Prueba del MSI correcta: instala, arranca el servicio, accesos directos bien y desinstala limpio."
          exit 0

      - name: Subir registros de msiexec
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registros-msi
          path: ./RegistrosMsi/
          if-no-files-found: ignore

      - name: Probar la instalación del .exe en el runner
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Get-ChildItem ./SalidaSinaptic/SinapticRemoto-*.exe | Select-Object -First 1
          Write-Host "Instalando en silencio: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--silent-install' -PassThru
          $p | Wait-Process -Timeout 300 -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 30
          $dir = 'C:\Program Files\SinapticRemoto'
          Write-Host "== Contenido de $dir =="
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          Write-Host "== Servicio =="
          sc.exe qc SinapticRemoto | Out-String | Write-Host
          $q = sc.exe query SinapticRemoto | Out-String
          Write-Host $q
          Write-Host "== Menú Inicio =="
          Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\SinapticRemoto" -ErrorAction SilentlyContinue | ForEach-Object {
            $l = (New-Object -ComObject WScript.Shell).CreateShortcut($_.FullName)
            Write-Host "$($_.Name) -> $($l.TargetPath) $($l.Arguments)"
          }
          Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup" -ErrorAction SilentlyContinue | ForEach-Object {
            $l = (New-Object -ComObject WScript.Shell).CreateShortcut($_.FullName)
            Write-Host "Inicio automático: $($_.Name) -> $($l.TargetPath) $($l.Arguments)"
          }
          $log = Get-ChildItem "$env:ProgramData\SinapticRemoto\log" -Recurse -Filter *.log -ErrorAction SilentlyContinue
          $log += Get-ChildItem "$env:APPDATA\SinapticRemoto\log" -Recurse -Filter *.log -ErrorAction SilentlyContinue
          foreach ($f in $log) { Write-Host "== $($f.FullName) =="; Get-Content $f.FullName -Tail 30 | Write-Host }
          if (-not (Test-Path "$dir\SinapticRemoto.exe")) { throw "No quedó $dir\SinapticRemoto.exe" }
          if (Test-Path "$dir\rustdesk.exe") { throw "Sobra $dir\rustdesk.exe" }
          if ($q -notmatch 'RUNNING') { throw "El servicio SinapticRemoto no está en marcha" }
          Write-Host "Instalación correcta: SinapticRemoto.exe existe y el servicio está en marcha."

      - name: Upload exe y msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sinaptic-remoto-windows-x86_64
          if-no-files-found: error
          path: |
            ./SalidaSinaptic/SinapticRemoto-*.exe
            ./SalidaSinaptic/SinapticRemoto-*.msi

  build-android-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
    steps:
      - name: Comprobar secretos de firma
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          falta=0
          for v in ANDROID_SIGNING_KEY ANDROID_ALIAS ANDROID_KEY_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v: no se firma con la llave de depuración"; falta=1; fi
          done
          exit $falta

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ env.TARGET }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ env.TARGET }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/${{ env.TARGET }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build apk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Gradle firma de forma provisional con la de depuración; el paso siguiente
          # vuelve a firmar con la llave propia (apksigner reemplaza las firmas).
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/${{ env.TARGET }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          mkdir -p SalidaSinaptic
          pushd flutter
          # Variante completa (controla y se deja controlar): co.sinaptic.remoto
          flutter build apk --release --flavor completo --target-platform android-arm64 --split-per-abi
          ls -l build/app/outputs/flutter-apk/
          APK=$(find build/app/outputs/flutter-apk -name 'app-arm64-v8a-completo-release.apk' | head -n 1)
          test -n "$APK"
          mv "$APK" ../SalidaSinaptic/sin-firmar-completo.apk
          # Variante solo cliente (sin accesibilidad ni captura de pantalla): co.sinaptic.remoto.cliente
          flutter build apk --release --flavor cliente --dart-define=SINAPTIC_SOLO_CLIENTE=true --target-platform android-arm64 --split-per-abi
          ls -l build/app/outputs/flutter-apk/
          APK=$(find build/app/outputs/flutter-apk -name 'app-arm64-v8a-cliente-release.apk' | head -n 1)
          test -n "$APK"
          mv "$APK" ../SalidaSinaptic/sin-firmar-cliente.apk
          popd

      - name: Firmar apk con la llave propia
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$SDK/build-tools/$BT/apksigner"
          echo "apksigner: $APKSIGNER"
          KS="$RUNNER_TEMP/sinaptic-remoto.jks"
          echo "$ANDROID_SIGNING_KEY" | base64 -d > "$KS"
          firmar() {
            local ENTRADA="$1" SALIDA="$2"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ANDROID_ALIAS" \
              --ks-pass env:ANDROID_KEY_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$SALIDA" "$ENTRADA"
            rm -f "$ENTRADA" "$SALIDA.idsig"
            "$APKSIGNER" verify --verbose --print-certs "$SALIDA" | tee verificacion.txt
            if grep -qi "Android Debug" verificacion.txt; then
              echo "::error::$SALIDA quedó firmado con la llave de depuración"; exit 1
            fi
            grep -q "CN=Sinaptic Remoto" verificacion.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verificacion.txt
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verificacion.txt
          }
          firmar SalidaSinaptic/sin-firmar-completo.apk "SalidaSinaptic/SinapticRemoto-${{ env.SINAPTIC_VERSION }}-aarch64.apk"
          firmar SalidaSinaptic/sin-firmar-cliente.apk "SalidaSinaptic/SinapticRemoto-Cliente-${{ env.SINAPTIC_VERSION }}-aarch64.apk"
          rm -f "$KS"
          sha256sum SalidaSinaptic/*.apk

      - name: Revisar el manifiesto final de los APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -n 1)
          AAPT2="$SDK/build-tools/$BT/aapt2"
          mkdir -p Manifiestos
          for V in completo cliente; do
            if [ "$V" = cliente ]; then
              APK="SalidaSinaptic/SinapticRemoto-Cliente-${{ env.SINAPTIC_VERSION }}-aarch64.apk"
            else
              APK="SalidaSinaptic/SinapticRemoto-${{ env.SINAPTIC_VERSION }}-aarch64.apk"
            fi
            echo "===== $V: $APK ====="
            "$AAPT2" dump badging "$APK" | grep -E "^(package|application-label|application:|launchable-activity)" | tee "Manifiestos/$V-badging.txt"
            "$AAPT2" dump permissions "$APK" | tee "Manifiestos/$V-permisos.txt"
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "Manifiestos/$V-manifiesto.txt"
            grep -E "E: (service|receiver|activity|provider)" -A3 "Manifiestos/$V-manifiesto.txt" | grep -E "A: android:name|E: " || true
          done
          # La variante cliente NO puede llevar nada del lado host.
          grep -q "name='co.sinaptic.remoto.cliente'" Manifiestos/cliente-badging.txt
          grep -q "name='co.sinaptic.remoto'" Manifiestos/completo-badging.txt
          prohibido='BIND_ACCESSIBILITY_SERVICE|android.accessibilityservice|MEDIA_PROJECTION|MainService|InputService|FloatingWindowService|BootReceiver|SYSTEM_ALERT_WINDOW|RECORD_AUDIO|RECEIVE_BOOT_COMPLETED|BIND_NOTIFICATION_LISTENER_SERVICE|READ_SMS|RECEIVE_SMS|SEND_SMS|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE'
          if grep -E "$prohibido" Manifiestos/cliente-permisos.txt Manifiestos/cliente-manifiesto.txt; then
            echo "::error::El APK cliente todavía declara permisos o servicios del lado host"; exit 1
          fi
          echo "APK cliente limpio: sin accesibilidad, sin captura de pantalla, sin permisos sensibles."

      - name: Subir manifiestos revisados
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifiestos-android
          path: Manifiestos/

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sinaptic-remoto-android-aarch64
          path: SalidaSinaptic/SinapticRemoto-*.apk

  publicar:
    needs: [build-windows-x64, build-android-arm64]
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar binarios
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sinaptic-remoto-*
          merge-multiple: true
          path: ./salida

      - name: Sumas SHA-256
        run: |
          cd salida
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar pre-release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ inputs.etiqueta }}
          target_commitish: ${{ github.sha }}
          name: "Sinaptic Remoto ${{ env.SINAPTIC_VERSION }} (${{ inputs.etiqueta }})"
          body: |
            Sinaptic Remoto: compilación de RustDesk ${{ env.VERSION }} (AGPL-3.0) con el servidor propio ya configurado.

            - Servidor ID y relé: 185.75.12.74 (puertos 21115-21119)
            - Llave pública del servidor incluida
            - Idioma por defecto: español
            - Icono propio de Sinaptic Remoto: monitor con cursor sobre el morado #6332F9 y el punto cian de la marca (la variante Cliente lleva además un celular delante)
            - Color de la app morado Sinaptic; se puede cambiar en Ajustes → «Color de la app»
            - Android: barra «Redactar» compacta (1 a 3 líneas, encima del teclado o arriba, minimizable) que deja ver la pantalla remota

            Android, dos APK firmados con la llave propia de Sinaptic (v1, v2 y v3); se pueden tener los dos a la vez:
            - `SinapticRemoto-${{ env.SINAPTIC_VERSION }}-aarch64.apk` (completo, `co.sinaptic.remoto`): controla otros equipos y también se deja controlar (pide accesibilidad y captura de pantalla).
            - `SinapticRemoto-Cliente-${{ env.SINAPTIC_VERSION }}-aarch64.apk` («Sinaptic Remoto Cliente», `co.sinaptic.remoto.cliente`): SOLO controla otros equipos. No declara el servicio de accesibilidad, ni la captura de pantalla, ni micrófono, ni ventana flotante, que es lo que hace que Play Protect bloquee la instalación desde el navegador.
            Windows, dos instaladores (todavía sin firma de código: SmartScreen avisa):
            - `SinapticRemoto-${{ env.SINAPTIC_VERSION }}-x86_64.msi` (nuevo): instalador MSI para todos los usuarios en `C:\Program Files\SinapticRemoto`, deja el servicio `SinapticRemoto` en marcha y crea los accesos directos (menú Inicio, escritorio, bandeja al iniciar sesión). Admite instalación silenciosa (`msiexec /i SinapticRemoto-${{ env.SINAPTIC_VERSION }}-x86_64.msi /qn`) y despliegue por GPO/Intune. Las versiones siguientes del MSI se instalan encima y reemplazan a la anterior. Si el equipo tiene la copia instalada con el `.exe`, hay que desinstalarla antes.
            - `SinapticRemoto-${{ env.SINAPTIC_VERSION }}-x86_64.exe`: autoinstalable (también funciona sin instalar).
            Código fuente: rama `sinaptic` de este repositorio. Basado en https://github.com/rustdesk/rustdesk (créditos y licencia AGPL-3.0 intactos).
          files: |
            ./salida/*
